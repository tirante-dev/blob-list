name: Update Chainlist Snapshot

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: refresh Chainlist snapshot
    runs-on: homelab-2cpu-8ram
    timeout-minutes: 30
    steps:
      - name: Install libatomic for Node
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends libatomic1
      - name: Install gh
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o "${RUNNER_TEMP}/gh.tgz"
          echo "${GH_SHA256}  ${RUNNER_TEMP}/gh.tgz" | sha256sum -c -
          sudo tar -xzf "${RUNNER_TEMP}/gh.tgz" --strip-components=2 -C /usr/local/bin "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CHAINLIST_APP_ID }}
          private-key: ${{ secrets.CHAINLIST_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Chainlist snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-chainlist

      # Opening the PR with the app token (not GITHUB_TOKEN) makes GitHub
      # trigger the normal pull_request CI run, so the required validate
      # check appears without a manual workflow dispatch.
      - name: Create pull request
        id: chainlist-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: data/chainlist/snapshot.json
          branch: at/refresh-chainlist-snapshot
          commit-message: "chore: refresh Chainlist snapshot"
          delete-branch: true
          title: "chore: refresh Chainlist snapshot"
          body: |
            Refreshes `data/chainlist/snapshot.json` from `ethereum-lists/chains`.

            This keeps the vendored Chainlist lockfile current while leaving chain metadata ownership upstream.
            Generated artifacts are not committed; they are published on GitHub Releases.

      # The app is the PR author, so the workflow's own GITHUB_TOKEN
      # (github-actions[bot]) is a distinct identity and its approval
      # satisfies main's required review. Auto-merge then lets GitHub
      # merge as soon as the required validate check passes.
      - name: Approve and enable auto-merge
        if: steps.chainlist-pr.outputs.pull-request-operation == 'created' || steps.chainlist-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.chainlist-pr.outputs.pull-request-url }}
        run: |
          set -euo pipefail

          # Required checks are strict (branch must be up to date). The PR
          # is cut from latest main moments ago, but if main moved mid-run,
          # update the branch with the app token so CI re-triggers on the
          # new head. Approve afterwards: a new push dismisses stale reviews.
          state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
          if [ "$state" = "BEHIND" ]; then
            GH_TOKEN="$APP_TOKEN" gh pr update-branch "$PR_URL" || \
              echo "::warning::Could not update $PR_URL; auto-merge may stall until the next scheduled run."
          fi

          gh pr review "$PR_URL" --approve --body "Automated approval for the scheduled Chainlist snapshot refresh."
          gh pr merge "$PR_URL" --auto --squash
